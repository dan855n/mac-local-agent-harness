[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-local-harness"
version = "0.1.0"
description = "A modular local-first engineering and Mac assistant for Ollama, LM Studio, and compatible chat APIs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.60",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "rich>=13.7",
  "pyserial>=3.5",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.scripts]
mac-harness = "mac_harness.cli:main"
mac-harness-gui = "mac_harness.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mac_harness = ["static/*"]
